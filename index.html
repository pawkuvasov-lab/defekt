<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дефектная ведомость с фото</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        h1 small {
            font-size: 13px;
            font-weight: 400;
            color: #64748b;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 12px;
            align-items: center;
        }
        .toolbar button {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 auto;
            justify-content: center;
            min-height: 44px;
        }
        .toolbar button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        .toolbar button.primary:active {
            background: #1d4ed8;
        }
        .toolbar button.danger {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }
        .toolbar button:active {
            transform: scale(0.95);
        }
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            border: 1px solid #e9edf2;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 400px;
        }
        th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 600;
            padding: 10px 6px;
            text-align: left;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
            font-size: 12px;
        }
        td {
            padding: 8px 5px;
            border-bottom: 1px solid #e9edf2;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 8px 6px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 13px;
            background: white;
            transition: 0.15s;
            min-width: 80px;
            -webkit-appearance: none;
            appearance: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .photo-cell {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .photo-preview {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }
        .photo-placeholder {
            font-size: 11px;
            color: #94a3b8;
            background: #f8fafc;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .btn-camera {
            background: #f1f5f9;
            border: none;
            border-radius: 30px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 500;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            min-height: 32px;
        }
        .btn-camera:active {
            background: #e2e8f0;
        }
        .btn-camera svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .empty-row-msg {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
        }
        #addRowBtn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: 2px dashed #d1d9e6;
            border-radius: 12px;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            min-height: 48px;
        }
        #addRowBtn:active {
            background: #f1f5f9;
        }
        #cameraInput {
            display: none;
        }

        /* Стили для окна предпросмотра */
        .preview-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .preview-window.active {
            display: flex;
        }
        .preview-content {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 95vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e9edf2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .preview-header h3 {
            margin: 0;
            font-size: 16px;
            color: #1e293b;
        }
        .preview-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preview-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            min-height: 40px;
        }
        .preview-actions .btn-pdf {
            background: #dc2626;
            color: white;
        }
        .preview-actions .btn-pdf:active {
            background: #b91c1c;
        }
        .preview-actions .btn-word {
            background: #2563eb;
            color: white;
        }
        .preview-actions .btn-word:active {
            background: #1d4ed8;
        }
        .preview-actions .btn-close {
            background: #e9edf2;
            color: #475569;
        }
        .preview-actions .btn-close:active {
            background: #d1d9e6;
        }
        .preview-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
            background: #f8fafc;
        }
        .preview-body #previewTableWrap {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-family: 'Times New Roman', Times, serif;
            overflow-x: auto;
        }
        .preview-body #previewTableWrap table {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
            line-height: 1;
            border-collapse: collapse;
            width: 100%;
            min-width: 500px;
        }
        .preview-body #previewTableWrap th {
            background-color: #d9d9d9;
            padding: 4px 6px;
            border: 1px solid #000;
            font-weight: bold;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
        }
        .preview-body #previewTableWrap td {
            padding: 4px 6px;
            border: 1px solid #000;
            vertical-align: middle;
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
        }
        .preview-body #previewTableWrap .photo-img {
            max-width: 5cm;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .preview-body #previewTableWrap .no-photo {
            color: #999;
            font-style: italic;
        }
        .preview-body #previewTableWrap h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 13pt;
            margin: 0 0 5px 0;
            padding: 0;
            line-height: 1;
        }
        .preview-body #previewTableWrap .date {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
            margin: 0 0 10px 0;
            padding: 0;
            line-height: 1;
        }

        @media (max-width: 600px) {
            body { padding: 6px; }
            .container { padding: 8px; border-radius: 12px; }
            h1 { font-size: 17px; }
            .toolbar button { font-size: 12px; padding: 8px 10px; min-height: 40px; }
            th { font-size: 11px; padding: 6px 4px; }
            td { padding: 6px 4px; font-size: 12px; }
            select, input[type="text"] { font-size: 12px; padding: 6px 4px; min-height: 36px; }
            .photo-preview { width: 35px; height: 35px; }
            .btn-camera { font-size: 11px; padding: 4px 8px; min-height: 28px; }
            .photo-placeholder { font-size: 10px; padding: 2px 8px; }
            #addRowBtn { font-size: 13px; padding: 10px; min-height: 44px; }
            .preview-actions button { font-size: 12px; padding: 6px 12px; min-height: 36px; }
            .preview-header h3 { font-size: 14px; }
            .preview-body { padding: 10px; }
            .preview-body #previewTableWrap { padding: 12px; }
            .preview-body #previewTableWrap table { font-size: 10pt; min-width: 350px; }
            .preview-body #previewTableWrap th { font-size: 10pt; padding: 3px 4px; }
            .preview-body #previewTableWrap td { font-size: 10pt; padding: 3px 4px; }
            .preview-body #previewTableWrap .photo-img { max-width: 3.5cm; }
        }

        @media (max-width: 400px) {
            th { font-size: 10px; padding: 4px 3px; }
            td { font-size: 11px; padding: 4px 3px; }
            .photo-cell { gap: 4px; }
            .photo-preview { width: 30px; height: 30px; }
            .btn-camera { font-size: 10px; padding: 3px 6px; }
            .photo-placeholder { display: none; }
            table { min-width: 320px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        📋 Дефектная ведомость
        <small id="rowCount">0 записей</small>
    </h1>

    <div class="toolbar">
        <button class="primary" onclick="exportExcel()">📊 Эксель</button>
        <button class="primary" onclick="showPreview()">📄 PDF / Word</button>
        <button class="danger" onclick="clearAll()">🗑️ Очистить</button>
    </div>

    <div class="table-wrap">
        <table id="defectTable">
            <thead>
                <tr>
                    <th style="width:8%">№</th>
                    <th style="width:25%">Конструкция</th>
                    <th style="width:25%">Дефект</th>
                    <th style="width:42%">Фото</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Строки добавляются сюда -->
            </tbody>
        </table>
    </div>

    <button id="addRowBtn" onclick="addRow()">➕ Добавить строку</button>

    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <!-- Окно предпросмотра -->
    <div class="preview-window" id="previewWindow">
        <div class="preview-content">
            <div class="preview-header">
                <h3>📄 Предпросмотр</h3>
                <div class="preview-actions">
                    <button class="btn-pdf" onclick="downloadPDF()">📄 PDF</button>
                    <button class="btn-word" onclick="downloadWord()">📝 Word</button>
                    <button class="btn-close" onclick="closePreview()">✕</button>
                </div>
            </div>
            <div class="preview-body" id="previewBody">
                <div id="previewTableWrap">
                    <!-- Сюда будет вставлена таблица -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const DEFECT_LIST = [
            'Трещина', 'Скол', 'Коррозия', 'Деформация', 'Износ',
            'Отслоение покрытия', 'Непровар', 'Загрязнение', 'Повреждение резьбы', 'Прочие'
        ];

        let rows = [];
        const tbody = document.getElementById('tableBody');
        const rowCountSpan = document.getElementById('rowCount');
        const cameraInput = document.getElementById('cameraInput');
        let currentPhotoRowIndex = null;

        function updateRowCount() {
            rowCountSpan.textContent = rows.length + ' записей';
        }

        function createDefectSelect(selectedValue) {
            const select = document.createElement('select');
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '— Выбрать —';
            select.appendChild(emptyOpt);
            
            DEFECT_LIST.forEach(def => {
                const opt = document.createElement('option');
                opt.value = def;
                opt.textContent = def;
                if (def === selectedValue) opt.selected = true;
                select.appendChild(opt);
            });
            if (!selectedValue || !DEFECT_LIST.includes(selectedValue)) {
                select.value = '';
            }
            return select;
        }

        function renderTable() {
            tbody.innerHTML = '';
            if (rows.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="4" class="empty-row-msg">Нет записей</td>`;
                tbody.appendChild(tr);
                updateRowCount();
                return;
            }

            rows.forEach((row, index) => {
                const tr = document.createElement('tr');

                const td0 = document.createElement('td');
                td0.style.textAlign = 'center';
                td0.textContent = index + 1;
                tr.appendChild(td0);

                const td1 = document.createElement('td');
                const input1 = document.createElement('input');
                input1.type = 'text';
                input1.placeholder = 'Конструкция';
                input1.value = row.construction || '';
                input1.addEventListener('input', function(e) {
                    rows[index].construction = this.value;
                });
                td1.appendChild(input1);
                tr.appendChild(td1);

                const td2 = document.createElement('td');
                const select = createDefectSelect(row.defect);
                select.addEventListener('change', function(e) {
                    rows[index].defect = this.value;
                });
                td2.appendChild(select);
                tr.appendChild(td2);

                const td3 = document.createElement('td');
                const photoDiv = document.createElement('div');
                photoDiv.className = 'photo-cell';

                const preview = document.createElement('img');
                preview.className = 'photo-preview';
                if (row.photoData) {
                    preview.src = row.photoData;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }

                const placeholderSpan = document.createElement('span');
                placeholderSpan.className = 'photo-placeholder';
                placeholderSpan.textContent = row.photoData ? '✅' : 'нет';

                const camBtn = document.createElement('button');
                camBtn.className = 'btn-camera';
                camBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    📷
                `;
                camBtn.setAttribute('data-index', index);
                camBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.getAttribute('data-index'));
                    currentPhotoRowIndex = idx;
                    cameraInput.value = '';
                    cameraInput.click();
                });

                const removePhotoBtn = document.createElement('button');
                removePhotoBtn.className = 'btn-camera';
                removePhotoBtn.textContent = '✕';
                removePhotoBtn.style.background = '#fee2e2';
                removePhotoBtn.style.color = '#b91c1c';
                removePhotoBtn.style.padding = '2px 8px';
                removePhotoBtn.title = 'Удалить фото';
                removePhotoBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.getAttribute('data-index'));
                    rows[idx].photoData = null;
                    renderTable();
                });
                removePhotoBtn.setAttribute('data-index', index);
                if (!row.photoData) removePhotoBtn.style.display = 'none';

                photoDiv.appendChild(preview);
                photoDiv.appendChild(placeholderSpan);
                photoDiv.appendChild(camBtn);
                photoDiv.appendChild(removePhotoBtn);
                td3.appendChild(photoDiv);
                tr.appendChild(td3);

                tbody.appendChild(tr);
            });

            updateRowCount();
        }

        window.addRow = function() {
            rows.push({
                defect: '',
                construction: '',
                photoData: null
            });
            renderTable();
            setTimeout(() => {
                const lastRow = tbody.lastElementChild;
                if (lastRow) lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        };

        cameraInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    if (currentPhotoRowIndex !== null && rows[currentPhotoRowIndex]) {
                        rows[currentPhotoRowIndex].photoData = dataUrl;
                        renderTable();
                        currentPhotoRowIndex = null;
                    } else {
                        alert('Не удалось определить строку для фото');
                    }
                };
                reader.readAsDataURL(file);
            }
            this.value = '';
        });

        window.clearAll = function() {
            if (rows.length === 0) return;
            if (confirm('Удалить все записи?')) {
                rows = [];
                renderTable();
            }
        };

        // ========== ГЕНЕРАЦИЯ ТАБЛИЦЫ ДЛЯ PDF ==========
        function generateTableHTML() {
            let html = `
                <h2>Дефектная ведомость</h2>
                <p class="date">Дата: ${new Date().toLocaleDateString()}</p>
                <table>
                    <thead>
                        <tr>
                            <th style="width:8%;">№</th>
                            <th style="width:25%;">Конструкция</th>
                            <th style="width:25%;">Дефект</th>
                            <th style="width:42%;">Фото</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rows.forEach((row, i) => {
                const photoHtml = row.photoData 
                    ? `<img src="${row.photoData}" class="photo-img" />` 
                    : '<span class="no-photo">Нет фото</span>';
                
                html += `
                    <tr>
                        <td style="text-align: center;">${i+1}</td>
                        <td>${row.construction || ''}</td>
                        <td>${row.defect || ''}</td>
                        <td style="text-align: center;">${photoHtml}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;
            return html;
        }

        // ========== ПОКАЗАТЬ ПРЕДПРОСМОТР ==========
        window.showPreview = function() {
            if (rows.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }
            document.getElementById('previewTableWrap').innerHTML = generateTableHTML();
            document.getElementById('previewWindow').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closePreview = function() {
            document.getElementById('previewWindow').classList.remove('active');
            document.body.style.overflow = '';
        };

        // ========== СКАЧАТЬ PDF (НОВЫЙ МЕТОД - БЕЗ CANVAS) ==========
        window.downloadPDF = function() {
            if (rows.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            // Настройки страницы
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 15;
            const maxWidth = pageWidth - margin * 2;
            
            let yPos = margin;

            // Функция для добавления текста
            function addText(text, x, y, fontSize = 12, isBold = false) {
                pdf.setFont('Times', isBold ? 'bold' : 'normal');
                pdf.setFontSize(fontSize);
                pdf.text(text, x, y);
                return y + (fontSize * 0.35);
            }

            // Функция для добавления фото
            function addImage(imgData, x, y, maxW) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = function() {
                        const ratio = img.width / img.height;
                        let w = maxW;
                        let h = w / ratio;
                        if (h > 40) {
                            h = 40;
                            w = h * ratio;
                        }
                        try {
                            pdf.addImage(imgData, 'JPEG', x, y, w, h);
                        } catch(e) {
                            // Если JPEG не подходит, пробуем PNG
                            pdf.addImage(imgData, 'PNG', x, y, w, h);
                        }
                        resolve(y + h + 2);
                    };
                    img.onerror = function() {
                        resolve(y + 10);
                    };
                    img.src = imgData;
                });
            }

            // Заголовок
            yPos = addText('Дефектная ведомость', margin, yPos, 14, true);
            yPos += 2;
            yPos = addText('Дата: ' + new Date().toLocaleDateString(), margin, yPos, 12);
            yPos += 6;

            // Таблица
            const col1 = 20;  // №
            const col2 = 55;  // Конструкция
            const col3 = 90;  // Дефект
            const col4 = 130; // Фото
            const colWidths = [15, 35, 35, 40];
            const startX = margin;
            const rowHeight = 10;

            // Заголовки таблицы
            pdf.setFillColor(217, 217, 217);
            pdf.rect(startX, yPos - 4, maxWidth, rowHeight, 'F');
            
            pdf.setFont('Times', 'bold');
            pdf.setFontSize(11);
            pdf.text('№', startX + 5, yPos + 2);
            pdf.text('Конструкция', startX + 25, yPos + 2);
            pdf.text('Дефект', startX + 65, yPos + 2);
            pdf.text('Фото', startX + 105, yPos + 2);
            
            pdf.setFont('Times', 'normal');
            yPos += rowHeight;

            // Данные
            async function renderRows() {
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    
                    // Проверяем, нужно ли перенести на новую страницу
                    if (yPos + 30 > pageHeight - margin) {
                        pdf.addPage();
                        yPos = margin + 5;
                    }

                    // Рисуем границы ячеек
                    const rowY = yPos;
                    
                    // №
                    pdf.rect(startX, rowY, 15, rowHeight);
                    pdf.text(String(i + 1), startX + 5, rowY + 5);
                    
                    // Конструкция
                    pdf.rect(startX + 15, rowY, 35, rowHeight);
                    const constrText = row.construction || '';
                    const constrLines = pdf.splitTextToSize(constrText, 33);
                    pdf.text(constrLines, startX + 18, rowY + 5);
                    
                    // Дефект
                    pdf.rect(startX + 50, rowY, 35, rowHeight);
                    const defectText = row.defect || '';
                    const defectLines = pdf.splitTextToSize(defectText, 33);
                    pdf.text(defectLines, startX + 53, rowY + 5);
                    
                    // Фото
                    pdf.rect(startX + 85, rowY, 40, rowHeight);
                    if (row.photoData) {
                        await addImage(row.photoData, startX + 88, rowY + 1, 36);
                    } else {
                        pdf.setFont('Times', 'italic');
                        pdf.setFontSize(9);
                        pdf.text('Нет фото', startX + 90, rowY + 6);
                        pdf.setFont('Times', 'normal');
                        pdf.setFontSize(11);
                    }
                    
                    yPos += rowHeight;
                }
            }

            // Запускаем рендеринг
            renderRows().then(() => {
                pdf.save('дефектная_ведомость.pdf');
            });
        };

        // ========== СКАЧАТЬ WORD ==========
        window.downloadWord = function() {
            let htmlContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office"
                      xmlns:w="urn:schemas-microsoft-com:office:word"
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="UTF-8">
                    <title>Дефектная ведомость</title>
                    <!--[if gte mso 9]>
                    <xml>
                        <w:WordDocument>
                            <w:View>Print</w:View>
                            <w:Zoom>100</w:Zoom>
                        </w:WordDocument>
                    </xml>
                    <![endif]-->
                    <style>
                        * { margin: 0; padding: 0; }
                        body { 
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                            line-height: 1;
                            margin: 20px;
                        }
                        h2 { 
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 14pt;
                            margin: 0 0 5px 0;
                            padding: 0;
                            line-height: 1;
                        }
                        p {
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                            margin: 0 0 10px 0;
                            padding: 0;
                            line-height: 1;
                        }
                        table { 
                            width: 100%; 
                            border-collapse: collapse; 
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                            line-height: 1;
                        }
                        th { 
                            background-color: #d9d9d9;
                            padding: 6px 8px; 
                            border: 1px solid #000;
                            font-weight: bold;
                            text-align: center;
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                        }
                        td { 
                            padding: 6px 8px; 
                            border: 1px solid #000;
                            vertical-align: middle;
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                        }
                        .photo-img {
                            max-width: 7cm;
                            height: auto;
                        }
                        .no-photo {
                            color: #999;
                            font-style: italic;
                        }
                    </style>
                </head>
                <body>
                    <h2>Дефектная ведомость</h2>
                    <p>Дата: ${new Date().toLocaleDateString()}</p>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:8%;">№</th>
                                <th style="width:25%;">Конструкция</th>
                                <th style="width:25%;">Дефект</th>
                                <th style="width:42%;">Фото</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            rows.forEach((row, i) => {
                let photoHtml;
                if (row.photoData) {
                    photoHtml = `<img src="${row.photoData}" class="photo-img" />`;
                } else {
                    photoHtml = '<span class="no-photo">Нет фото</span>';
                }
                
                htmlContent += `
                    <tr>
                        <td style="text-align: center;">${i+1}</td>
                        <td>${row.construction || ''}</td>
                        <td>${row.defect || ''}</td>
                        <td style="text-align: center;">${photoHtml}</td>
                    </tr>
                `;
            });

            htmlContent += `
                        </tbody>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob([htmlContent], { 
                type: 'application/msword;charset=utf-8' 
            });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'дефектная_ведомость.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => {
                URL.revokeObjectURL(link.href);
            }, 100);
        };

        // ========== ЭКСПОРТ В EXCEL ==========
        window.exportExcel = function() {
            if (rows.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }

            const data = [];
            data.push(['№', 'Конструкция', 'Наименование дефекта', 'Фото']);
            
            rows.forEach((row, i) => {
                data.push([
                    i + 1,
                    row.construction || '',
                    row.defect || '',
                    row.photoData ? 'Фото добавлено' : 'Нет фото'
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [
                { wch: 8 },
                { wch: 25 },
                { wch: 25 },
                { wch: 30 }
            ];
            
            XLSX.utils.book_append_sheet(wb, ws, 'Дефекты');
            XLSX.writeFile(wb, 'дефектная_ведомость.xlsx');
        };

        // Инициализация с примерами
        rows.push(
            { defect: 'Трещина', construction: 'Корпус насоса', photoData: null },
            { defect: 'Коррозия', construction: 'Трубопровод Ду-100', photoData: null }
        );
        renderTable();
    })();
</script>
</body>
</html>
