<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дефектная ведомость с фото</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f5f7fa;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 16px;
            align-items: center;
        }
        .toolbar button {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 auto;
            justify-content: center;
        }
        .toolbar button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #1d4ed8;
        }
        .toolbar button.danger {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }
        .toolbar button:active {
            transform: scale(0.96);
        }
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 16px;
            border: 1px solid #e9edf2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 500px;
        }
        th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 600;
            padding: 14px 8px;
            text-align: left;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #e9edf2;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px 8px;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            transition: 0.15s;
            min-width: 120px;
        }
        select:focus, input[type="text"]:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .photo-cell {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .photo-preview {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }
        .photo-placeholder {
            font-size: 12px;
            color: #94a3b8;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .btn-camera {
            background: #f1f5f9;
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .btn-camera:active {
            background: #e2e8f0;
        }
        .btn-camera svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .empty-row-msg {
            text-align: center;
            color: #94a3b8;
            padding: 24px 0;
        }
        #addRowBtn {
            margin-top: 12px;
            width: 100%;
            padding: 14px;
            border: 2px dashed #d1d9e6;
            border-radius: 16px;
            background: transparent;
            font-size: 15px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
        }
        #addRowBtn:active {
            background: #f1f5f9;
        }
        #cameraInput {
            display: none;
        }
        @media (max-width: 600px) {
            .container { padding: 12px; }
            th, td { padding: 8px 4px; font-size: 13px; }
            select, input[type="text"] { font-size: 13px; padding: 8px 6px; }
            .photo-preview { width: 50px; height: 50px; }
            .btn-camera { font-size: 12px; padding: 4px 10px; }
            .toolbar button { font-size: 13px; padding: 8px 12px; }
        }

        /* Стили для окна предпросмотра */
        .preview-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .preview-window.active {
            display: flex;
        }
        .preview-content {
            background: white;
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e9edf2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .preview-header h3 {
            margin: 0;
            font-size: 18px;
            color: #1e293b;
        }
        .preview-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .preview-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .preview-actions .btn-pdf {
            background: #dc2626;
            color: white;
        }
        .preview-actions .btn-pdf:hover {
            background: #b91c1c;
        }
        .preview-actions .btn-word {
            background: #2563eb;
            color: white;
        }
        .preview-actions .btn-word:hover {
            background: #1d4ed8;
        }
        .preview-actions .btn-close {
            background: #e9edf2;
            color: #475569;
        }
        .preview-actions .btn-close:hover {
            background: #d1d9e6;
        }
        .preview-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            background: #f8fafc;
        }
        .preview-body #previewTableWrap {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-family: 'Times New Roman', Times, serif;
        }
        .preview-body #previewTableWrap table {
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            line-height: 1;
            border-collapse: collapse;
            width: 100%;
        }
        .preview-body #previewTableWrap th {
            background-color: #d9d9d9;
            padding: 6px 8px;
            border: 1px solid #000;
            font-weight: bold;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
        }
        .preview-body #previewTableWrap td {
            padding: 6px 8px;
            border: 1px solid #000;
            vertical-align: middle;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
        }
        .preview-body #previewTableWrap .photo-img {
            max-width: 7cm;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .preview-body #previewTableWrap .no-photo {
            color: #999;
            font-style: italic;
        }
        .preview-body #previewTableWrap h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14pt;
            margin: 0 0 5px 0;
            padding: 0;
            line-height: 1;
        }
        .preview-body #previewTableWrap .date {
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            margin: 0 0 10px 0;
            padding: 0;
            line-height: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        📋 Дефектная ведомость
        <small id="rowCount">0 записей</small>
    </h1>

    <div class="toolbar">
        <button class="primary" onclick="exportExcel()">📊 Эксель</button>
        <button class="primary" onclick="showPreview()">📄 PDF / Word</button>
        <button class="danger" onclick="clearAll()">🗑️ Очистить</button>
    </div>

    <div class="table-wrap">
        <table id="defectTable">
            <thead>
                <tr>
                    <th style="width:8%">№</th>
                    <th style="width:22%">Конструкция</th>
                    <th style="width:22%">Наименование дефекта</th>
                    <th style="width:48%">Фото</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Строки добавляются сюда -->
            </tbody>
        </table>
    </div>

    <button id="addRowBtn" onclick="addRow()">➕ Добавить строку</button>

    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <!-- Окно предпросмотра -->
    <div class="preview-window" id="previewWindow">
        <div class="preview-content">
            <div class="preview-header">
                <h3>📄 Предпросмотр документа</h3>
                <div class="preview-actions">
                    <button class="btn-pdf" onclick="downloadPDF()">📄 Сохранить PDF</button>
                    <button class="btn-word" onclick="downloadWord()">📝 Сохранить Word</button>
                    <button class="btn-close" onclick="closePreview()">✕ Закрыть</button>
                </div>
            </div>
            <div class="preview-body" id="previewBody">
                <div id="previewTableWrap">
                    <!-- Сюда будет вставлена таблица -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const DEFECT_LIST = [
            'Трещина', 'Скол', 'Коррозия', 'Деформация', 'Износ',
            'Отслоение покрытия', 'Непровар', 'Загрязнение', 'Повреждение резьбы', 'Прочие'
        ];

        let rows = [];
        const tbody = document.getElementById('tableBody');
        const rowCountSpan = document.getElementById('rowCount');
        const cameraInput = document.getElementById('cameraInput');
        let currentPhotoRowIndex = null;

        function updateRowCount() {
            rowCountSpan.textContent = rows.length + ' записей';
        }

        function createDefectSelect(selectedValue) {
            const select = document.createElement('select');
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '— Выбрать —';
            select.appendChild(emptyOpt);
            
            DEFECT_LIST.forEach(def => {
                const opt = document.createElement('option');
                opt.value = def;
                opt.textContent = def;
                if (def === selectedValue) opt.selected = true;
                select.appendChild(opt);
            });
            if (!selectedValue || !DEFECT_LIST.includes(selectedValue)) {
                select.value = '';
            }
            return select;
        }

        function renderTable() {
            tbody.innerHTML = '';
            if (rows.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="4" class="empty-row-msg">Нет записей. Нажмите «Добавить строку»</td>`;
                tbody.appendChild(tr);
                updateRowCount();
                return;
            }

            rows.forEach((row, index) => {
                const tr = document.createElement('tr');

                // №
                const td0 = document.createElement('td');
                td0.style.textAlign = 'center';
                td0.textContent = index + 1;
                tr.appendChild(td0);

                // Конструкция (теперь первый столбец после №)
                const td1 = document.createElement('td');
                const input1 = document.createElement('input');
                input1.type = 'text';
                input1.placeholder = 'Введите конструкцию';
                input1.value = row.construction || '';
                input1.addEventListener('input', function(e) {
                    rows[index].construction = this.value;
                });
                td1.appendChild(input1);
                tr.appendChild(td1);

                // Наименование дефекта (теперь второй столбец после №)
                const td2 = document.createElement('td');
                const select = createDefectSelect(row.defect);
                select.addEventListener('change', function(e) {
                    rows[index].defect = this.value;
                });
                td2.appendChild(select);
                tr.appendChild(td2);

                // Фото
                const td3 = document.createElement('td');
                const photoDiv = document.createElement('div');
                photoDiv.className = 'photo-cell';

                const preview = document.createElement('img');
                preview.className = 'photo-preview';
                if (row.photoData) {
                    preview.src = row.photoData;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }

                const placeholderSpan = document.createElement('span');
                placeholderSpan.className = 'photo-placeholder';
                placeholderSpan.textContent = row.photoData ? '✅ Фото добавлено' : 'нет фото';

                const camBtn = document.createElement('button');
                camBtn.className = 'btn-camera';
                camBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    Снять фото
                `;
                camBtn.setAttribute('data-index', index);
                camBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.getAttribute('data-index'));
                    currentPhotoRowIndex = idx;
                    cameraInput.value = '';
                    cameraInput.click();
                });

                const removePhotoBtn = document.createElement('button');
                removePhotoBtn.className = 'btn-camera';
                removePhotoBtn.textContent = '✕';
                removePhotoBtn.style.background = '#fee2e2';
                removePhotoBtn.style.color = '#b91c1c';
                removePhotoBtn.style.padding = '4px 10px';
                removePhotoBtn.title = 'Удалить фото';
                removePhotoBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.getAttribute('data-index'));
                    rows[idx].photoData = null;
                    renderTable();
                });
                removePhotoBtn.setAttribute('data-index', index);
                if (!row.photoData) removePhotoBtn.style.display = 'none';

                photoDiv.appendChild(preview);
                photoDiv.appendChild(placeholderSpan);
                photoDiv.appendChild(camBtn);
                photoDiv.appendChild(removePhotoBtn);
                td3.appendChild(photoDiv);
                tr.appendChild(td3);

                tbody.appendChild(tr);
            });

            updateRowCount();
        }

        window.addRow = function() {
            rows.push({
                defect: '',
                construction: '',
                photoData: null
            });
            renderTable();
            setTimeout(() => {
                const lastRow = tbody.lastElementChild;
                if (lastRow) lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        };

        cameraInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    if (currentPhotoRowIndex !== null && rows[currentPhotoRowIndex]) {
                        rows[currentPhotoRowIndex].photoData = dataUrl;
                        renderTable();
                        currentPhotoRowIndex = null;
                    } else {
                        alert('Не удалось определить строку для фото');
                    }
                };
                reader.readAsDataURL(file);
            }
            this.value = '';
        });

        window.clearAll = function() {
            if (rows.length === 0) return;
            if (confirm('Удалить все записи?')) {
                rows = [];
                renderTable();
            }
        };

        // ========== ГЕНЕРАЦИЯ HTML ТАБЛИЦЫ ДЛЯ ПРЕДПРОСМОТРА ==========
        function generateTableHTML() {
            let html = `
                <h2>Дефектная ведомость</h2>
                <p class="date">Дата: ${new Date().toLocaleDateString()}</p>
                <table>
                    <thead>
                        <tr>
                            <th style="width:8%;">№</th>
                            <th style="width:22%;">Конструкция</th>
                            <th style="width:22%;">Наименование дефекта</th>
                            <th style="width:48%;">Фото</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rows.forEach((row, i) => {
                const photoHtml = row.photoData 
                    ? `<img src="${row.photoData}" class="photo-img" />` 
                    : '<span class="no-photo">Нет фото</span>';
                
                html += `
                    <tr>
                        <td style="text-align: center;">${i+1}</td>
                        <td>${row.construction || ''}</td>
                        <td>${row.defect || ''}</td>
                        <td style="text-align: center;">${photoHtml}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;
            return html;
        }

        // ========== ПОКАЗАТЬ ПРЕДПРОСМОТР ==========
        window.showPreview = function() {
            if (rows.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }
            document.getElementById('previewTableWrap').innerHTML = generateTableHTML();
            document.getElementById('previewWindow').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closePreview = function() {
            document.getElementById('previewWindow').classList.remove('active');
            document.body.style.overflow = '';
        };

        // ========== СКАЧАТЬ PDF ==========
        window.downloadPDF = function() {
            const element = document.getElementById('previewTableWrap');
            
            // Добавляем стили для PDF
            const style = document.createElement('style');
            style.textContent = `
                * { font-family: 'Times New Roman', Times, serif !important; }
                table { font-family: 'Times New Roman', Times, serif !important; }
                th, td { font-family: 'Times New Roman', Times, serif !important; }
                h2 { font-family: 'Times New Roman', Times, serif !important; }
                p { font-family: 'Times New Roman', Times, serif !important; }
            `;
            element.appendChild(style);
            
            html2canvas(element, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                logging: false,
                font: {
                    family: 'Times New Roman'
                }
            }).then(function(canvas) {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('дефектная_ведомость.pdf');
                element.removeChild(style);
            }).catch(function(err) {
                alert('Ошибка при создании PDF: ' + err.message);
                element.removeChild(style);
            });
        };

        // ========== СКАЧАТЬ WORD ==========
        window.downloadWord = function() {
            let htmlContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office"
                      xmlns:w="urn:schemas-microsoft-com:office:word"
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="UTF-8">
                    <title>Дефектная ведомость</title>
                    <!--[if gte mso 9]>
                    <xml>
                        <w:WordDocument>
                            <w:View>Print</w:View>
                            <w:Zoom>100</w:Zoom>
                        </w:WordDocument>
                    </xml>
                    <![endif]-->
                    <style>
                        * { margin: 0; padding: 0; }
                        body { 
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                            line-height: 1;
                            margin: 20px;
                        }
                        h2 { 
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 14pt;
                            margin: 0 0 5px 0;
                            padding: 0;
                            line-height: 1;
                        }
                        p {
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                            margin: 0 0 10px 0;
                            padding: 0;
                            line-height: 1;
                        }
                        table { 
                            width: 100%; 
                            border-collapse: collapse; 
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                            line-height: 1;
                        }
                        th { 
                            background-color: #d9d9d9;
                            padding: 6px 8px; 
                            border: 1px solid #000;
                            font-weight: bold;
                            text-align: center;
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                        }
                        td { 
                            padding: 6px 8px; 
                            border: 1px solid #000;
                            vertical-align: middle;
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 12pt;
                        }
                        .photo-img {
                            max-width: 7cm;
                            height: auto;
                        }
                        .no-photo {
                            color: #999;
                            font-style: italic;
                        }
                    </style>
                </head>
                <body>
                    <h2>Дефектная ведомость</h2>
                    <p>Дата: ${new Date().toLocaleDateString()}</p>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:8%;">№</th>
                                <th style="width:22%;">Конструкция</th>
                                <th style="width:22%;">Наименование дефекта</th>
                                <th style="width:48%;">Фото</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            rows.forEach((row, i) => {
                let photoHtml;
                if (row.photoData) {
                    photoHtml = `<img src="${row.photoData}" class="photo-img" />`;
                } else {
                    photoHtml = '<span class="no-photo">Нет фото</span>';
                }
                
                htmlContent += `
                    <tr>
                        <td style="text-align: center;">${i+1}</td>
                        <td>${row.construction || ''}</td>
                        <td>${row.defect || ''}</td>
                        <td style="text-align: center;">${photoHtml}</td>
                    </tr>
                `;
            });

            htmlContent += `
                        </tbody>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob([htmlContent], { 
                type: 'application/msword;charset=utf-8' 
            });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'дефектная_ведомость.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => {
                URL.revokeObjectURL(link.href);
            }, 100);
        };

        // ========== ЭКСПОРТ В EXCEL ==========
        window.exportExcel = function() {
            if (rows.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }

            const data = [];
            data.push(['№', 'Конструкция', 'Наименование дефекта', 'Фото']);
            
            rows.forEach((row, i) => {
                data.push([
                    i + 1,
                    row.construction || '',
                    row.defect || '',
                    row.photoData ? 'Фото добавлено' : 'Нет фото'
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [
                { wch: 8 },
                { wch: 25 },
                { wch: 25 },
                { wch: 30 }
            ];
            
            XLSX.utils.book_append_sheet(wb, ws, 'Дефекты');
            XLSX.writeFile(wb, 'дефектная_ведомость.xlsx');
        };

        // Инициализация с примерами
        rows.push(
            { defect: 'Трещина', construction: 'Корпус насоса', photoData: null },
            { defect: 'Коррозия', construction: 'Трубопровод Ду-100', photoData: null }
        );
        renderTable();
    })();
</script>
</body>
</html>
